<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante Oliva - KDS Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .item-done { text-decoration: line-through; opacity: 0.45; }
  </style>
</head>
<body class="bg-[#F8F5EE] text-[#2C302E] min-h-screen p-4 sm:p-6">

  <!-- Cabecera KDS Cocina -->
  <header class="flex justify-between items-center pb-4 border-b border-[#E0D7C6] mb-6">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-[#1E3A2B] text-[#FDFBF7] flex items-center justify-center text-2xl shadow-sm">
        👨‍🍳
      </div>
      <div>
        <h1 class="font-serif-title text-2xl font-bold text-[#1E3A2B] tracking-tight">Pase de Cocina</h1>
        <p class="text-xs text-[#2D4F3B] font-semibold flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-[#2D4F3B] animate-pulse"></span>
          Tapas, Platos y Postres en tiempo real
        </p>
      </div>
    </div>
    <div class="text-right">
      <p id="clock" class="text-xl font-mono font-extrabold text-[#1E3A2B]">00:00:00</p>
      <p id="pendingCount" class="text-xs font-bold text-[#8B2635] uppercase tracking-wider">0 comandas activas</p>
    </div>
  </header>

  <!-- Rejilla de Pedidos de Cocina -->
  <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
    <div class="col-span-full text-center py-20 text-[#8C8275]">Cargando comandas de cocina...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyz7V5nxJFw8Khi_c9L-KrgXvozY058e7yBSrnes6IkaAX4boZXOsC2BIWVYQMc1khG/exec";

    let currentOrders = [];
    // Estado local para los platos tachados en cocina: { "PED-1234": { 0: true, 1: false } }
    let completedItemsState = {};
    // Conjunto para evitar que pedidos recién marcados reaparezcan mientras Google Sheets procesa
    let locallyClearedIds = new Set();

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-ES');
      renderOrders();
    }, 1000);

    async function fetchOrders() {
      try {
        const res = await fetch(`${API_URL}?action=getPedidos`, { redirect: 'follow' });
        const data = await res.json();
        
        // Filtramos para ignorar pedidos con Estado_Cocina = 'Listo' y los recién borrados localmente
        currentOrders = (Array.isArray(data) ? data : []).filter(o => {
          const id = o.ID_Pedido || o.id_pedido || o.ID || '';
          if (locallyClearedIds.has(id)) return false;
          
          const st = String(o.Estado_Cocina || o.estado_cocina || o['Estado_Cocina '] || '').trim();
          return st !== 'Listo';
        });
        
        renderOrders();
      } catch (err) {
        console.error("Error al cargar pedidos:", err);
      }
    }

    function calculateMinutes(dateStr) {
      if (!dateStr) return 0;
      try {
        let orderDate;
        if (dateStr.includes('/')) {
          const parts = dateStr.split(' ');
          const dParts = parts[0].split('/');
          const tParts = parts[1].split(':');
          orderDate = new Date(dParts[2], dParts[1] - 1, dParts[0], tParts[0], tParts[1], tParts[2] || 0);
        } else {
          orderDate = new Date(dateStr);
        }
        return Math.floor((new Date() - orderDate) / 60000);
      } catch (e) {
        return 0;
      }
    }

    // Parsea los ítems y filtra dejando SOLO comida (excluye bebidas)
    function parseKitchenItems(resumenStr) {
      if (!resumenStr) return [];
      const rawItems = resumenStr.includes('|') ? resumenStr.split('|') : resumenStr.split(',');
      const items = [];

      rawItems.forEach((item, idx) => {
        const trimmed = item.trim();
        if (!trimmed) return;

        let categoria = 'Platos';
        let texto = trimmed;

        if (trimmed.startsWith('[')) {
          const closeBracket = trimmed.indexOf(']');
          if (closeBracket !== -1) {
            const rawCat = trimmed.substring(1, closeBracket).trim().toLowerCase();
            texto = trimmed.substring(closeBracket + 1).trim();

            if (rawCat.includes('bebida') || rawCat.includes('bar') || rawCat.includes('refresco')) return; // EXCLUIR EN COCINA
            else if (rawCat.includes('tapa') || rawCat.includes('entrante')) categoria = 'Tapas';
            else if (rawCat.includes('postre')) categoria = 'Postres';
            else categoria = 'Platos';
          }
        } else {
          const low = trimmed.toLowerCase();
          if (low.includes('caña') || low.includes('cerveza') || low.includes('vino') || low.includes('agua') || low.includes('refresco') || low.includes('coca') || low.includes('fanta') || low.includes('copa') || low.includes('café') || low.includes('cafe')) {
            return; // EXCLUIR BEBIDAS
          } else if (low.includes('bravas') || low.includes('croqueta') || low.includes('tapa') || low.includes('pan') || low.includes('aceituna') || low.includes('ensalada') || low.includes('calamares')) {
            categoria = 'Tapas';
          } else if (low.includes('postre') || low.includes('tarta') || low.includes('helado') || low.includes('coulant')) {
            categoria = 'Postres';
          }
        }

        items.push({ originalIndex: idx, categoria, texto });
      });

      return items;
    }

    function toggleItemDone(orderId, itemIndex) {
      if (!completedItemsState[orderId]) {
        completedItemsState[orderId] = {};
      }
      completedItemsState[orderId][itemIndex] = !completedItemsState[orderId][itemIndex];
      renderOrders();
    }

    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      const counter = document.getElementById('pendingCount');

      // Filtrar comandas que tengan comida para preparar
      const kitchenOrders = currentOrders.filter(o => parseKitchenItems(o.Resumen_Platos || o.resumen_platos).length > 0);

      counter.innerText = `${kitchenOrders.length} comanda${kitchenOrders.length === 1 ? '' : 's'} de cocina`;

      if (kitchenOrders.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-24 bg-white/70 rounded-3xl border border-[#E5DECF] shadow-xs">
            <p class="text-4xl mb-2">🌿</p>
            <p class="text-lg font-bold text-[#1E3A2B]">No hay comandas en cocina</p>
            <p class="text-xs text-[#8C8275] mt-1">Los nuevos platos entrarán automáticamente aquí</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = kitchenOrders.map(order => {
        const mesa = order.Mesa || order.mesa || 'Mesa ?';
        const rawDate = order.Fecha_Hora || order.fecha_hora || '';
        const diffMins = calculateMinutes(rawDate);
        const hora = rawDate.includes(' ') ? rawDate.split(' ')[1].substring(0, 5) : '';
        const notas = order.Notas_Cliente || order.notas_cliente || '';
        const id = order.ID_Pedido || order.id_pedido || order.ID || 'PED';
        const row = order.rowIndex;

        const isLate = diffMins >= 15;
        const timeAgoText = diffMins < 1 ? 'Recién pedida' : `Hace ${diffMins} min`;

        const items = parseKitchenItems(order.Resumen_Platos || order.resumen_platos);
        const orderDoneState = completedItemsState[id] || {};

        const tapas = items.filter(i => i.categoria === 'Tapas');
        const platos = items.filter(i => i.categoria === 'Platos');
        const postres = items.filter(i => i.categoria === 'Postres');

        const allDone = items.length > 0 && items.every(i => orderDoneState[i.originalIndex]);

        const renderSubgroup = (list, title, icon, bgClass, borderClass, textClass) => {
          if (list.length === 0) return '';
          return `
            <div class="${bgClass} border ${borderClass} rounded-2xl p-2.5 mb-2.5">
              <div class="flex items-center gap-1.5 pb-1 mb-1.5 border-b ${borderClass} ${textClass}">
                <span class="text-sm">${icon}</span>
                <span class="text-[10px] font-black uppercase tracking-wider">${title}</span>
              </div>
              <div class="space-y-1.5">
                ${list.map(it => {
                  const done = !!orderDoneState[it.originalIndex];
                  return `
                    <div onclick="toggleItemDone('${id}', ${it.originalIndex})" class="cursor-pointer flex items-center justify-between p-2 rounded-xl bg-white/80 hover:bg-white transition-all select-none ${done ? 'item-done bg-gray-100' : ''}">
                      <span class="text-xs font-bold ${done ? 'text-gray-400' : textClass}">${it.texto}</span>
                      <span class="text-xs font-bold px-2 py-0.5 rounded-lg ${done ? 'bg-emerald-100 text-emerald-800' : 'bg-white text-gray-400 border'}">
                        ${done ? '✓ Listo' : '⚪ Pendiente'}
                      </span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        };

        return `
          <div class="bg-white border ${isLate ? 'border-red-400 ring-2 ring-red-400/20' : 'border-[#E0D7C6]'} rounded-3xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition-all">
            <div>
              <!-- Cabecera Comanda -->
              <div class="flex justify-between items-start border-b border-[#EFE9DC] pb-3 mb-3">
                <div>
                  <span class="text-lg font-black ${isLate ? 'bg-red-600 text-white' : 'bg-[#1E3A2B] text-white'} px-3.5 py-1 rounded-xl tracking-tight shadow-xs inline-block">
                    ${mesa}
                  </span>
                  <div class="flex items-center gap-1.5 mt-1.5">
                    ${isLate ? '<span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>' : ''}
                    <span class="text-xs font-extrabold ${isLate ? 'text-red-600' : 'text-[#8C8275]'}">
                      ⏱️ ${timeAgoText}
                    </span>
                  </div>
                </div>
                <span class="text-xs font-mono font-bold text-[#8C8275] bg-[#F4EFE6] px-2 py-1 rounded-lg">${hora}</span>
              </div>

              <!-- Bloques por categoría -->
              <div class="mb-3">
                ${renderSubgroup(tapas, 'Tapas & Entrantes', '🥗', 'bg-emerald-50/70', 'border-emerald-200/80', 'text-[#1E3A2B]')}
                ${renderSubgroup(platos, 'Platos Principales / Raciones', '🥘', 'bg-rose-50/70', 'border-rose-200/80', 'text-[#8B2635]')}
                ${renderSubgroup(postres, 'Postres', '🍰', 'bg-amber-50/70', 'border-amber-200/80', 'text-amber-900')}
              </div>

              <!-- Notas -->
              ${notas ? `
                <div class="bg-[#FFF4E5] border border-[#FFE2B8] rounded-2xl p-2.5 text-xs text-[#995200] mb-3">
                  <span class="font-black uppercase tracking-wider block mb-0.5">⚠️ Nota del comensal:</span>
                  <span class="font-medium">${notas}</span>
                </div>
              ` : ''}
            </div>

            <!-- Botón Despachar Comanda -->
            <div class="pt-3 border-t border-[#EFE9DC] flex justify-between items-center">
              <span class="text-[11px] text-[#A69B8D] font-mono font-bold">${id}</span>
              <button onclick="markDone(${row}, '${id}')" class="${allDone ? 'bg-emerald-700 hover:bg-emerald-800' : 'bg-[#1E3A2B] hover:bg-[#8B2635]'} text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1.5">
                <span>✓</span> ${allDone ? 'Mesa Completada' : 'Despachar Todo'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function markDone(rowIndex, idPedido) {
      // Registrar ID localmente y eliminar de la vista de inmediato
      if (idPedido) locallyClearedIds.add(idPedido);
      currentOrders = currentOrders.filter(o => {
        const id = o.ID_Pedido || o.id_pedido || o.ID || '';
        return id !== idPedido && o.rowIndex !== rowIndex;
      });
      renderOrders();

      // Enviar actualización a Google Sheets
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            action: 'marcarListoCocina', 
            rowIndex: rowIndex,
            idPedido: idPedido 
          })
        });
      } catch (e) {
        console.error("Error al marcar comanda como lista:", e);
      }
    }

    fetchOrders();
    setInterval(fetchOrders, 4000);
  </script>
</body>
</html>
