<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante Oliva - Panel de Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#F8F5EE] text-[#2C302E] min-h-screen p-4 sm:p-6">

  <!-- Cabecera KDS -->
  <header class="flex justify-between items-center pb-4 border-b border-[#E3DC handle-custom] border-[#E0D7C6] mb-6">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-[#1E3A2B] text-[#FDFBF7] flex items-center justify-center text-2xl shadow-sm">
        🫒
      </div>
      <div>
        <h1 class="font-serif-title text-2xl font-bold text-[#1E3A2B] tracking-tight">Comandas de Cocina & Barra</h1>
        <p class="text-xs text-[#2D4F3B] font-semibold flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-[#2D4F3B] animate-pulse"></span>
          Conectado en tiempo real
        </p>
      </div>
    </div>
    <div class="text-right">
      <p id="clock" class="text-xl font-mono font-extrabold text-[#1E3A2B]">00:00:00</p>
      <p id="pendingCount" class="text-xs font-bold text-[#8B2635] uppercase tracking-wider">0 comandas activas</p>
    </div>
  </header>

  <!-- Rejilla de Pedidos -->
  <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <div class="col-span-full text-center py-20 text-[#8C8275]">Cargando comandas activas...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwNcXq1xYbo5Zm68ZGIrENIuac6FwIsp_wV00KHPG075hY3Hv-ZOcaYR6jF2tvdGAqf/exec";

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-ES');
    }, 1000);

    let currentOrders = [];

    async function fetchOrders() {
      try {
        const res = await fetch(`${API_URL}?action=getPedidos`, { redirect: 'follow' });
        const data = await res.json();
        currentOrders = Array.isArray(data) ? data : [];
        renderOrders();
      } catch (err) {
        console.error("Error al cargar pedidos:", err);
      }
    }

    function formatTime(val) {
      if (!val) return '';
      const str = String(val);
      if (str.includes('T')) return str.split('T')[1].substring(0, 5);
      if (str.includes(' ')) return str.split(' ')[1].substring(0, 5);
      return str;
    }

    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      const counter = document.getElementById('pendingCount');

      counter.innerText = `${currentOrders.length} comanda${currentOrders.length === 1 ? '' : 's'} activa${currentOrders.length === 1 ? '' : 's'}`;

      if (currentOrders.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-24 bg-white/70 rounded-3xl border border-[#E5DECF] shadow-xs">
            <p class="text-4xl mb-2">🌿</p>
            <p class="text-lg font-bold text-[#1E3A2B]">No hay comandas pendientes</p>
            <p class="text-xs text-[#8C8275] mt-1">Los nuevos pedidos entrarán en esta pantalla de inmediato</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = currentOrders.map(order => {
        const mesa = order.Mesa || order.mesa || 'Mesa ?';
        const hora = formatTime(order.Fecha_Hora || order.fecha_hora);
        const platos = String(order.Resumen_Platos || order.resumen_platos || '').split(',');
        const notas = order.Notas_Cliente || order.notas_cliente || '';
        const id = order.ID_Pedido || order.id_pedido || 'PED';
        const row = order.rowIndex;

        return `
          <div class="bg-white border border-[#E0D7C6] rounded-2xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow">
            <div>
              <div class="flex justify-between items-start border-b border-[#EFE9DC] pb-2.5 mb-3">
                <span class="text-lg font-black text-[#1E3A2B] bg-[#EAE3D2] px-3 py-1 rounded-xl tracking-tight">
                  ${mesa}
                </span>
                <span class="text-xs font-mono font-bold text-[#8C8275] mt-1">${hora}</span>
              </div>

              <div class="space-y-1.5 mb-3">
                ${platos.map(item => `
                  <div class="py-1.5 px-2.5 bg-[#FAF8F3] border border-[#EFECE4] rounded-lg text-sm font-semibold text-[#2C302E]">
                    ${item.trim()}
                  </div>
                `).join('')}
              </div>

              ${notas ? `
                <div class="bg-[#FBF0F1] border border-[#F2D1D5] rounded-xl p-2.5 text-xs text-[#8B2635] mb-3">
                  <span class="font-extrabold uppercase tracking-wider block mb-0.5">Nota:</span>
                  ${notas}
                </div>
              ` : ''}
            </div>

            <div class="pt-3 border-t border-[#EFE9DC] flex justify-between items-center">
              <span class="text-[11px] text-[#A69B8D] font-mono font-medium">${id}</span>
              <button onclick="markDone(${row})" class="bg-[#8B2635] hover:bg-[#A83244] text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition-transform active:scale-95 flex items-center gap-1.5">
                <span>✓</span> Listo
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function markDone(rowIndex) {
      currentOrders = currentOrders.filter(o => o.rowIndex !== rowIndex);
      renderOrders();

      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'marcarListo', rowIndex: rowIndex })
      });
    }

    fetchOrders();
    setInterval(fetchOrders, 4000);
  </script>
</body>
</html>
