<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Códigos QR - El Txoko</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería ligera y estable para generar QRs vectoriales -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
    
    @media print {
      body { background: white !important; padding: 0 !important; }
      .no-print { display: none !important; }
      #qrGrid {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 16px !important;
        max-width: 100% !important;
        margin: 0 !important;
      }
      .qr-card {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        border: 1.5px dashed #A8A29E !important;
        box-shadow: none !important;
        background: white !important;
        padding: 16px !important;
      }
    }
  </style>
</head>
<body class="bg-[#F7F4EE] text-[#292524] p-6 min-h-screen">

  <!-- Panel de control de configuración (se oculta al imprimir) -->
  <header class="max-w-4xl mx-auto bg-white p-6 rounded-3xl shadow-sm mb-8 no-print border border-[#E8E1D3]">
    <div class="flex items-center gap-3 mb-4 pb-3 border-b border-[#EFE9DC]">
      <div class="w-10 h-10 rounded-xl bg-[#292524] text-white flex items-center justify-center text-xl font-bold">
        🖨️
      </div>
      <div>
        <h1 class="font-serif-title text-xl font-bold text-[#1C1917]">Generador de Códigos QR para Mesas</h1>
        <p class="text-xs text-[#78716C]">Genera e imprime tarjetas de mesa personalizadas para El Txoko</p>
      </div>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 text-xs font-semibold">
      <div class="sm:col-span-6">
        <label class="block text-[#78716C] uppercase tracking-wider mb-1.5 text-[11px] font-bold">
          URL base de tu carta (sin ?mesa=):
        </label>
        <input 
          type="text" 
          id="baseUrl" 
          value="https://tuusuario.github.io/index.html" 
          placeholder="https://tuusuario.github.io/index.html"
          class="w-full bg-[#FAF7F2] border border-[#E3DAC8] rounded-xl p-2.5 outline-none focus:border-[#B45309] text-[#292524]"
        >
      </div>

      <div class="sm:col-span-3">
        <label class="block text-[#78716C] uppercase tracking-wider mb-1.5 text-[11px] font-bold">
          Total de mesas:
        </label>
        <input 
          type="number" 
          id="totalMesas" 
          value="50" 
          min="1" 
          max="100" 
          class="w-full bg-[#FAF7F2] border border-[#E3DAC8] rounded-xl p-2.5 outline-none focus:border-[#B45309] text-[#292524]"
        >
      </div>

      <div class="sm:col-span-3 flex items-end gap-2">
        <button 
          onclick="generateQRs()" 
          class="flex-1 bg-[#292524] text-[#FAF7F2] py-2.5 rounded-xl font-bold hover:bg-[#1C1917] transition-all text-xs uppercase tracking-wider shadow-xs active:scale-95"
        >
          Generar
        </button>
        <button 
          onclick="window.print()" 
          class="bg-[#B45309] text-white px-4 py-2.5 rounded-xl font-bold hover:bg-[#92400E] transition-all text-xs uppercase tracking-wider shadow-xs active:scale-95 flex items-center gap-1.5"
        >
          <span>Imprimir</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor con las tarjetas listas para pantalla e impresora -->
  <main id="qrGrid" class="max-w-5xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6"></main>

  <script>
    function generateQRs() {
      const container = document.getElementById('qrGrid');
      container.innerHTML = '';

      let base = document.getElementById('baseUrl').value.trim();
      if (base.endsWith('/')) base = base.slice(0, -1);
      
      const total = parseInt(document.getElementById('totalMesas').value, 10) || 10;

      for (let i = 1; i <= total; i++) {
        const mesaName = `Mesa ${i}`;
        const tableUrl = `${base}?mesa=${encodeURIComponent(mesaName)}`;

        const card = document.createElement('div');
        card.className = "qr-card bg-[#FAF7F2] p-5 rounded-3xl border border-[#E8E1D3] shadow-xs flex flex-col items-center justify-between text-center transition-all";
        
        card.innerHTML = `
          <div>
            <p class="text-[9px] font-black text-[#A8A29E] uppercase tracking-widest mb-0.5">El Txoko</p>
            <h2 class="text-xl font-black font-serif-title text-[#1C1917] mb-3">${mesaName}</h2>
          </div>
          
          <div class="p-2.5 bg-white rounded-2xl shadow-2xs border border-[#EFE9DC] flex items-center justify-center">
            <div id="qrcode-${i}"></div>
          </div>
          
          <div class="mt-3.5">
            <p class="text-[11px] font-extrabold text-[#B45309] tracking-tight">Escanea para pedir</p>
            <p class="text-[9px] text-[#78716C] font-semibold mt-0.5">Carta digital interactiva</p>
          </div>
        `;

        container.appendChild(card);

        // Renderizado del código QR vectorial
        new QRCode(document.getElementById(`qrcode-${i}`), {
          text: tableUrl,
          width: 125,
          height: 125,
          colorDark: "#1c1917",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    // Ejecución inicial automática
    generateQRs();
  </script>
</body>
</html>
