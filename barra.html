<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante Oliva - TPV Barra & Caja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .item-done { text-decoration: line-through; opacity: 0.45; }
  </style>
</head>
<body class="bg-[#F4F7FB] text-[#2C302E] min-h-screen p-4 sm:p-6">

  <!-- Cabecera Barra y Caja -->
  <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-blue-200 mb-6 gap-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-blue-900 text-white flex items-center justify-center text-2xl shadow-sm">
        🍸
      </div>
      <div>
        <h1 class="font-serif-title text-2xl font-bold text-blue-950 tracking-tight">Barra & Control de Caja</h1>
        <p class="text-xs text-blue-700 font-semibold flex items-center gap-1.5 mt-0.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>En vivo (Sincronizado)</span>
        </p>
      </div>
    </div>

    <!-- Pestañas: Bebidas en vivo vs Cobro por Mesas -->
    <div class="flex items-center gap-2 bg-blue-100/70 p-1.5 rounded-2xl text-xs font-bold w-full sm:w-auto justify-center">
      <button onclick="switchTab('bebidas')" id="tab-bebidas" class="px-4 py-2 rounded-xl bg-blue-900 text-white shadow-xs transition-all">
        🍸 Pase de Bebidas
      </button>
      <button onclick="switchTab('caja')" id="tab-caja" class="px-4 py-2 rounded-xl text-blue-900 hover:bg-white/60 transition-all flex items-center gap-1.5">
        <span>💳 Cobro por Mesas</span>
        <span id="mesasBadge" class="bg-blue-900 text-white text-[10px] px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>

    <div class="text-right hidden sm:block">
      <p id="clock" class="text-xl font-mono font-extrabold text-blue-950">00:00:00</p>
      <p id="pendingCount" class="text-xs font-bold text-blue-700 uppercase tracking-wider">0 comandas</p>
    </div>
  </header>

  <!-- VISTA 1: COMANDAS DE BEBIDAS EN VIVO -->
  <div id="view-bebidas">
    <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <div class="col-span-full text-center py-20 text-blue-400">Cargando bebidas pendientes...</div>
    </div>
  </div>

  <!-- VISTA 2: CONTROL DE CAJA Y COBRO POR MESAS -->
  <div id="view-caja" class="hidden">
    <div id="cajaGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <div class="col-span-full text-center py-20 text-blue-400">Consultando mesas activas...</div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyz7V5nxJFw8Khi_c9L-KrgXvozY058e7yBSrnes6IkaAX4boZXOsC2BIWVYQMc1khG/exec";

    let currentOrders = [];
    let currentTab = 'bebidas';
    let completedDrinksState = {};
    let locallyClearedIds = new Set();
    let locallyPaidTables = new Set();

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-ES');
    }, 1000);

    function switchTab(tab) {
      currentTab = tab;
      const bBtn = document.getElementById('tab-bebidas');
      const cBtn = document.getElementById('tab-caja');
      const vBebidas = document.getElementById('view-bebidas');
      const vCaja = document.getElementById('view-caja');

      if (tab === 'bebidas') {
        bBtn.className = "px-4 py-2 rounded-xl bg-blue-900 text-white shadow-xs transition-all";
        cBtn.className = "px-4 py-2 rounded-xl text-blue-900 hover:bg-white/60 transition-all flex items-center gap-1.5";
        vBebidas.classList.remove('hidden');
        vCaja.classList.add('hidden');
        renderOrders();
      } else {
        cBtn.className = "px-4 py-2 rounded-xl bg-blue-900 text-white shadow-xs transition-all flex items-center gap-1.5";
        bBtn.className = "px-4 py-2 rounded-xl text-blue-900 hover:bg-white/60 transition-all";
        vCaja.classList.remove('hidden');
        vBebidas.classList.add('hidden');
        renderCaja();
      }
    }

    async function fetchOrders() {
      try {
        // Anti-caché con timestamp Date.now() y cache: 'no-store'
        const antiCacheUrl = `${API_URL}?action=getPedidos&_t=${Date.now()}`;
        const res = await fetch(antiCacheUrl, { 
          method: 'GET',
          cache: 'no-store',
          redirect: 'follow' 
        });
        const data = await res.json();
        
        currentOrders = (Array.isArray(data) ? data : []).filter(o => {
          const mesa = String(o.Mesa || o.mesa || '').trim().toLowerCase();
          return !locallyPaidTables.has(mesa);
        });

        if (currentTab === 'bebidas') renderOrders();
        else renderCaja();

        updateMesasCount();
      } catch (err) {
        console.error("Error al cargar pedidos en barra:", err);
      }
    }

    function calculateMinutes(dateStr) {
      if (!dateStr) return 0;
      try {
        let orderDate;
        if (dateStr.includes('/')) {
          const parts = dateStr.split(' ');
          const dParts = parts[0].split('/');
          const tParts = parts[1].split(':');
          orderDate = new Date(dParts[2], dParts[1] - 1, dParts[0], tParts[0], tParts[1], tParts[2] || 0);
        } else {
          orderDate = new Date(dateStr);
        }
        return Math.floor((new Date() - orderDate) / 60000);
      } catch (e) {
        return 0;
      }
    }

    function parseBarDrinks(resumenStr) {
      if (!resumenStr) return [];
      const rawItems = resumenStr.includes('|') ? resumenStr.split('|') : resumenStr.split(',');
      const drinks = [];

      rawItems.forEach((item, idx) => {
        const trimmed = item.trim();
        if (!trimmed) return;

        if (trimmed.startsWith('[')) {
          const closeBracket = trimmed.indexOf(']');
          if (closeBracket !== -1) {
            const rawCat = trimmed.substring(1, closeBracket).trim().toLowerCase();
            const texto = trimmed.substring(closeBracket + 1).trim();
            if (rawCat.includes('bebida') || rawCat.includes('bar') || rawCat.includes('refresco') || rawCat.includes('cafe')) {
              drinks.push({ originalIndex: idx, texto });
            }
          }
        } else {
          const low = trimmed.toLowerCase();
          if (low.includes('caña') || low.includes('cerveza') || low.includes('vino') || low.includes('agua') || low.includes('refresco') || low.includes('coca') || low.includes('fanta') || low.includes('copa') || low.includes('café') || low.includes('cafe')) {
            drinks.push({ originalIndex: idx, texto: trimmed });
          }
        }
      });

      return drinks;
    }

    function updateMesasCount() {
      const activeTables = new Set();
      currentOrders.forEach(o => {
        const m = String(o.Mesa || o.mesa || '').trim();
        if (m) activeTables.add(m);
      });
      document.getElementById('mesasBadge').innerText = activeTables.size;
    }

    /* --- VISTA 1: PASE DE BEBIDAS --- */
    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      const counter = document.getElementById('pendingCount');

      const barOrders = currentOrders.filter(o => {
        const id = o.ID_Pedido || o.id_pedido || o.ID || '';
        if (locallyClearedIds.has(id)) return false;
        const st = String(o.Estado_Barra || o.estado_barra || '').trim();
        return st !== 'Listo' && parseBarDrinks(o.Resumen_Platos || o.resumen_platos).length > 0;
      });

      counter.innerText = `${barOrders.length} ronda${barOrders.length === 1 ? '' : 's'} de bebidas`;

      if (barOrders.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-24 bg-white/80 rounded-3xl border border-blue-100 shadow-xs">
            <p class="text-4xl mb-2">🍹</p>
            <p class="text-lg font-bold text-blue-950">No hay bebidas pendientes</p>
            <p class="text-xs text-blue-400 mt-1">Todas las bebidas han salido a las mesas</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = barOrders.map(order => {
        const mesa = order.Mesa || order.mesa || 'Mesa ?';
        const rawDate = order.Fecha_Hora || order.fecha_hora || '';
        const diffMins = calculateMinutes(rawDate);
        const hora = rawDate.includes(' ') ? rawDate.split(' ')[1].substring(0, 5) : '';
        const notas = order.Notas_Cliente || order.notas_cliente || '';
        const id = order.ID_Pedido || order.id_pedido || order.ID || 'PED';
        const row = order.rowIndex;

        const isLate = diffMins >= 10;
        const timeAgoText = diffMins < 1 ? 'Recién pedida' : `Hace ${diffMins} min`;
        const drinks = parseBarDrinks(order.Resumen_Platos || order.resumen_platos);
        const orderDoneState = completedDrinksState[id] || {};
        const allDone = drinks.length > 0 && drinks.every(d => orderDoneState[d.originalIndex]);

        return `
          <div class="bg-white border ${isLate ? 'border-red-400 ring-2 ring-red-400/20' : 'border-blue-200'} rounded-3xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition-all">
            <div>
              <div class="flex justify-between items-start border-b border-blue-100 pb-3 mb-3">
                <div>
                  <span class="text-lg font-black ${isLate ? 'bg-red-600 text-white' : 'bg-blue-900 text-white'} px-3.5 py-1 rounded-xl tracking-tight shadow-xs inline-block">
                    ${mesa}
                  </span>
                  <div class="flex items-center gap-1.5 mt-1.5">
                    ${isLate ? '<span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>' : ''}
                    <span class="text-xs font-extrabold ${isLate ? 'text-red-600' : 'text-blue-600'}">
                      ⏱️ ${timeAgoText}
                    </span>
                  </div>
                </div>
                <span class="text-xs font-mono font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded-lg border border-blue-100">${hora}</span>
              </div>

              <div class="bg-blue-50/70 border border-blue-200/70 rounded-2xl p-2.5 mb-3 space-y-1.5">
                <div class="flex items-center gap-1.5 pb-1 mb-1 border-b border-blue-200/50 text-blue-950">
                  <span class="text-sm">🍸</span>
                  <span class="text-[10px] font-black uppercase tracking-wider">Bebidas a servir</span>
                </div>
                ${drinks.map(d => {
                  const done = !!orderDoneState[d.originalIndex];
                  return `
                    <div onclick="toggleDrinkDone('${id}', ${d.originalIndex})" class="cursor-pointer flex items-center justify-between p-2 rounded-xl bg-white/80 hover:bg-white transition-all select-none ${done ? 'item-done bg-gray-100' : ''}">
                      <span class="text-xs font-bold ${done ? 'text-gray-400' : 'text-blue-950'}">${d.texto}</span>
                      <span class="text-xs font-bold px-2 py-0.5 rounded-lg ${done ? 'bg-emerald-100 text-emerald-800' : 'bg-white text-blue-400 border border-blue-100'}">
                        ${done ? '✓ Servida' : '⚪ Pendiente'}
                      </span>
                    </div>
                  `;
                }).join('')}
              </div>

              ${notas ? `
                <div class="bg-[#FFF4E5] border border-[#FFE2B8] rounded-2xl p-2.5 text-xs text-[#995200] mb-3">
                  <span class="font-black uppercase tracking-wider block mb-0.5">⚠️ Nota:</span>
                  <span class="font-medium">${notas}</span>
                </div>
              ` : ''}
            </div>

            <div class="pt-3 border-t border-blue-100 flex justify-between items-center">
              <span class="text-[11px] text-blue-400 font-mono font-bold">${id}</span>
              <button onclick="markBarDone(${row}, '${id}')" class="${allDone ? 'bg-emerald-700 hover:bg-emerald-800' : 'bg-blue-900 hover:bg-blue-800'} text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1.5">
                <span>✓</span> ${allDone ? 'Ronda Servida' : 'Servir Todo'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleDrinkDone(orderId, itemIndex) {
      if (!completedDrinksState[orderId]) completedDrinksState[orderId] = {};
      completedDrinksState[orderId][itemIndex] = !completedDrinksState[orderId][itemIndex];
      renderOrders();
    }

    async function markBarDone(rowIndex, idPedido) {
      if (idPedido) locallyClearedIds.add(idPedido);
      renderOrders();

      await fetch(`${API_URL}?action=marcarListoBarra&idPedido=${encodeURIComponent(idPedido)}&rowIndex=${rowIndex}&_t=${Date.now()}`, {
        method: 'GET',
        cache: 'no-store',
        mode: 'no-cors'
      });
    }

    /* --- VISTA 2: CAJA Y COBRO POR MESAS --- */
    function renderCaja() {
      const grid = document.getElementById('cajaGrid');
      
      const tablesMap = {};
      currentOrders.forEach(ord => {
        const mesa = String(ord.Mesa || ord.mesa || 'Mesa ?').trim();
        if (!tablesMap[mesa]) {
          tablesMap[mesa] = {
            total: 0,
            pedidos: []
          };
        }
        tablesMap[mesa].total += parseFloat(ord.Total || ord.total || 0);
        tablesMap[mesa].pedidos.push(ord);
      });

      const tableNames = Object.keys(tablesMap);

      if (tableNames.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-24 bg-white/80 rounded-3xl border border-blue-100 shadow-xs">
            <p class="text-4xl mb-2">🧾</p>
            <p class="text-lg font-bold text-blue-950">No hay mesas activas por cobrar</p>
            <p class="text-xs text-blue-400 mt-1">Todas las comandas han sido cobradas</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = tableNames.map(mesaName => {
        const tData = tablesMap[mesaName];
        
        return `
          <div class="bg-white border-2 border-emerald-600/30 rounded-3xl p-5 flex flex-col justify-between shadow-sm hover:shadow-md transition-all">
            <div>
              <div class="flex justify-between items-center border-b border-gray-100 pb-3 mb-3">
                <span class="text-xl font-black bg-blue-950 text-white px-4 py-1.5 rounded-2xl shadow-xs">
                  ${mesaName}
                </span>
                <div class="text-right">
                  <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Total Mesa</span>
                  <span class="text-2xl font-black text-[#8B2635]">${tData.total.toFixed(2)} €</span>
                </div>
              </div>

              <div class="space-y-2.5 mb-4 max-h-56 overflow-y-auto pr-1">
                ${tData.pedidos.map((p, idx) => {
                  const hora = (p.Fecha_Hora || p.fecha_hora || '').split(' ')[1] || '';
                  const items = (p.Resumen_Platos || p.resumen_platos || '').split('|');
                  return `
                    <div class="bg-[#F8F9FA] border border-gray-200/70 rounded-xl p-2.5 text-xs">
                      <div class="flex justify-between font-bold text-gray-700 pb-1 mb-1 border-b border-gray-200/50">
                        <span>Ronda #${idx + 1} (${hora.substring(0, 5)})</span>
                        <span class="text-[#8B2635]">${parseFloat(p.Total || p.total || 0).toFixed(2)} €</span>
                      </div>
                      <ul class="text-[11px] text-gray-600 space-y-0.5">
                        ${items.map(it => `<li>• ${it.replace(/\[.*?\]/, '').trim()}</li>`).join('')}
                      </ul>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <button onclick="cobrarMesa('${mesaName}')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-md transition-transform active:scale-95 flex items-center justify-center gap-2">
              <span>💳</span>
              <span>Cobrar y Cerrar ${mesaName} (${tData.total.toFixed(2)} €)</span>
            </button>
          </div>
        `;
      }).join('');
    }

    async function cobrarMesa(mesaName) {
      if (!confirm(`¿Confirmar cobro de ${mesaName}? La mesa volverá a quedar libre a 0.00 €.`)) return;

      locallyPaidTables.add(mesaName.toLowerCase());
      currentOrders = currentOrders.filter(o => String(o.Mesa || o.mesa || '').trim().toLowerCase() !== mesaName.toLowerCase());
      renderCaja();
      updateMesasCount();

      try {
        await fetch(`${API_URL}?action=cobrarMesa&mesa=${encodeURIComponent(mesaName)}&_t=${Date.now()}`, {
          method: 'GET',
          cache: 'no-store',
          mode: 'no-cors'
        });
      } catch (err) {
        console.error("Error al cobrar mesa:", err);
      }
    }

    // Consulta inicial y actualización en vivo cada 3 segundos
    fetchOrders();
    setInterval(fetchOrders, 3000);
  </script>
</body>
</html>
